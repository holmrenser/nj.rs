[package]
name = "nj_py"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true


[lib]
name = "nj_py"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310 builds a single stable-ABI wheel that works on CPython 3.10+,
# so the release matrix needs one wheel per platform instead of one per minor.
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py310"] }
nj = { path = "../nj" }
serde_json = "1.0.145"
serde-pyobject = "0.8.0"

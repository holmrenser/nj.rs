[package]
name = "nj"
description = "Neighbor-Joining phylogenetic tree inference. Auto-detects DNA/protein, supports multiple substitution models and bootstrap."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/nj"
keywords = ["phylogenetics", "bioinformatics", "newick", "neighbor-joining"]
categories = ["science", "algorithms", "command-line-utilities"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "nj"
path = "src/main.rs"

[[bench]]
name = "nj_bench"
harness = false

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[dependencies]
bitvec = "1.0.1"
getrandom = "0.2"
nanorand = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = "11.1.0"

# CLI-only dependencies
[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.indicatif]
version = "0.17"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

# Parallel feature
[dependencies.rayon]
version = "1"
optional = true


[features]
# default build only builds the library
default = []

# feature to build CLI. Implies `parallel` so the shipped binary
# (`cargo install nj --features cli`) is multi-threaded by default; the bare
# library stays lightweight and Rayon-free unless `parallel` is requested.
cli = ["clap", "indicatif", "serde_json", "parallel"]

# feature to enable parallel bootstrap and distance matrix computation via Rayon
parallel = ["rayon"]

# feature to enable the explicit core::simd distance kernel. Requires a nightly
# toolchain (uses the unstable `portable_simd` feature). Without it, the kernel
# uses the branchless scalar path, which the compiler still autovectorizes.
simd = []
